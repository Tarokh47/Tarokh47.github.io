<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>لیست کاربران</title>

<style>
body{
    font-family: Arial;
    background:#0b1220;
    color:white;
    text-align:center;
    padding:20px;
}

h1{color:#00d4ff;}

input, select, button{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    cursor:pointer;
    background:#00aaff;
    color:white;
}

table{
    margin:auto;
    width:80%;
    border-collapse:collapse;
    background:#111b2e;
    border-radius:10px;
    overflow:hidden;
    margin-top:20px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #223;
}

th{background:#00aaff;}

tr:hover{background:#1b2a44;}

.rank10{color:#ff3b3b;font-weight:bold;}
.rank9{color:#ff7a00;font-weight:bold;}
.rank7{color:#ffd000;font-weight:bold;}
.rank4{color:#a6ff00;font-weight:bold;}
.rank3{color:#00ffa6;}
.rank2{color:#00c2ff;}
.rank1{color:#b0b0b0;}
</style>
</head>

<body>

<h1>لیست کاربران سرور</h1>

<input type="text" id="search" placeholder="جستجو...">

<br>

<input type="text" id="name" placeholder="نام کاربر">
<select id="rank">
    <option value="10">10</option>
    <option value="9">9</option>
    <option value="7">7</option>
    <option value="4">4</option>
    <option value="3">3</option>
    <option value="2">2</option>
    <option value="1">1</option>
</select>

<button onclick="addUser()">افزودن</button>

<table id="table">
<tr>
<th>نام</th>
<th>رنک</th>
<th>حذف</th>
</tr>
</table>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [
    {name:"Parham Sanchez",rank:10},
    {name:"Arian Sanchez",rank:10},
    {name:"Mohsen Sanchez",rank:9}
];

function save(){
    localStorage.setItem("users",JSON.stringify(users));
}

function render(){
    let table = document.getElementById("table");
    table.innerHTML = `
    <tr>
        <th>نام</th>
        <th>رنک</th>
        <th>حذف</th>
    </tr>`;

    users.sort((a,b)=>b.rank-a.rank);

    users.forEach((u,i)=>{
        table.innerHTML += `
        <tr>
            <td>${u.name}</td>
            <td class="rank${u.rank}">${u.rank}</td>
            <td><button onclick="del(${i})">❌</button></td>
        </tr>`;
    });
}

function addUser(){
    let name = document.getElementById("name").value;
    let rank = document.getElementById("rank").value;

    if(name=="") return;

    users.push({name,rank:Number(rank)});
    save();
    render();
}

function del(i){
    users.splice(i,1);
    save();
    render();
}

document.getElementById("search").addEventListener("keyup",function(){
    let f = this.value.toLowerCase();
    let rows = document.querySelectorAll("tr");

    rows.forEach((r,i)=>{
        if(i==0) return;
        let name = r.children[0].innerText.toLowerCase();
        r.style.display = name.includes(f) ? "" : "none";
    });
});

render();
</script>

</body>
</html>
