<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanchez Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:white;text-align:center;padding:20px}
h1{color:#00d4ff}
input,button,select{padding:8px;margin:4px;border-radius:6px;border:none}
button{cursor:pointer;background:#00aaff;color:white}
table{margin:auto;width:90%;border-collapse:collapse;background:#111b2e;border-radius:10px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #223}
th{background:#00aaff}
tr:hover{background:#1b2a44}
.rank10{color:#ff2d2d;font-weight:bold}
.rank9{color:#ff5e00;font-weight:bold}
.rank8{color:#ff9f1a;font-weight:bold}
.rank7{color:#ffd000;font-weight:bold}
.rank6{color:#b6ff00;font-weight:bold}
.rank5{color:#00ff6a;font-weight:bold}
.rank4{color:#00ffa6;font-weight:bold}
.rank3{color:#00d4ff;font-weight:bold}
.rank2{color:#3b82f6;font-weight:bold}
.rank1{color:#a1a1aa;font-weight:bold}
#panel{display:none;margin:15px}
.tag{display:inline-block;padding:4px 8px;margin:2px;border-radius:8px;font-size:12px;font-weight:bold}
.farmer{background:#22c55e}.robber{background:#ef4444}.chopper{background:#f59e0b}
.useless{background:#6b7280}.aimgod{background:#8b5cf6}.dispatch{background:#06b6d4}
.guard{background:#3b82f6}.staff{background:#ec4899}
.loading{color:#00d4ff;font-size:18px;margin:20px}
.error{color:#ef4444;font-size:16px;margin:20px}
.card{background:#111b2e;padding:20px;border-radius:16px;margin:20px auto;max-width:800px}
</style>
</head>
<body>
<h1>🚀 Sanchez Admin Panel</h1>

<div id="status" class="loading">⏳ در حال اتصال به Gist...</div>

<div id="loginBox" class="card">
  <h3>🔐 ورود ادمین</h3>
  <input type="password" id="pass" placeholder="رمز ادمین">
  <button onclick="login()">ورود</button>
</div>

<div id="panel" class="card">
  <h3>➕ افزودن کاربر جدید</h3>
  <input type="text" id="name" placeholder="نام کاربر">
  <br><br>
  <div>
    <label><input type="checkbox" value="Farmer" class="division"> Farmer</label>
    <label><input type="checkbox" value="Robber" class="division"> Robber</label>
    <label><input type="checkbox" value="Chopper" class="division"> Chopper</label>
    <label><input type="checkbox" value="Useless" class="division"> Useless</label>
    <label><input type="checkbox" value="AimGod" class="division"> AimGod</label>
    <label><input type="checkbox" value="Dispatch" class="division"> Dispatch</label>
    <label><input type="checkbox" value="Guard" class="division"> Guard</label>
    <label><input type="checkbox" value="Staff" class="division"> Staff</label>
  </div>
  <br>
  <select id="rank">
    <option value="10">10</option><option value="9">9</option><option value="8">8</option>
    <option value="7">7</option><option value="6">6</option><option value="5">5</option>
    <option value="4">4</option><option value="3">3</option><option value="2">2</option>
    <option value="1">1</option>
  </select>
  <button onclick="addUser()">➕ افزودن</button>
  <br><br>
  <button onclick="forceRefresh()" style="background:#6b7280">🔄 بروزرسانی</button>
</div>

<br>
<input type="text" id="search" placeholder="🔍 جستجوی نام...">
<br><br>

<table id="table"></table>

<script>
// ======== تنظیمات Gist شما ========
const GIST_ID = 'db978b270d78413f39a6cd37f7b6a480';
const GITHUB_TOKEN = 'ghp_اینجا_توکن_خودت_رو_بذار'; // ← توکن رو عوض کن

// ======== متغیرها ========
const PASS="1234";
let isAdmin=false;
let users=[];

function setStatus(msg, isError=false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : 'loading';
}

// دریافت از Gist
async function loadFromGist() {
  try {
    setStatus('⏳ در حال دریافت...');
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    let content = '[]';
    if (data.files && data.files['users.json']) {
      content = data.files['users.json'].content;
    }
    
    users = JSON.parse(content);
    if (!Array.isArray(users)) users = [];
    setStatus(`✅ ${users.length} کاربر`);
    render();
  } catch (error) {
    setStatus(`❌ خطا: ${error.message}`, true);
    users = [];
    render();
  }
}

// ذخیره در Gist
async function saveToGist() {
  try {
    setStatus('⏳ در حال ذخیره...');
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        files: {
          'users.json': {
            content: JSON.stringify(users, null, 2)
          }
        }
      })
    });
    
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'خطا');
    }
    
    setStatus(`✅ ${users.length} کاربر ذخیره شد`);
    render();
  } catch (error) {
    setStatus(`❌ خطا: ${error.message}`, true);
  }
}

// توابع مدیریت
function login() {
  if (document.getElementById('pass').value === PASS) {
    isAdmin = true;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadFromGist();
  } else {
    alert('❌ رمز اشتباه است!');
  }
}

function forceRefresh() {
  if (isAdmin) loadFromGist();
}

async function addUser() {
  if (!isAdmin) return alert('وارد شو!');
  const name = document.getElementById('name').value.trim();
  if (!name) return alert('نام رو وارد کن!');
  
  const divisions = [];
  document.querySelectorAll(".division:checked").forEach(x => divisions.push(x.value));
  const rank = Number(document.getElementById('rank').value);
  
  users.push({ name, divisions, rank });
  await saveToGist();
  
  document.getElementById('name').value = '';
  document.querySelectorAll(".division").forEach(x => x.checked = false);
}

async function deleteUser(i) {
  if (!isAdmin) return;
  if (!confirm(`حذف "${users[i].name}"؟`)) return;
  users.splice(i, 1);
  await saveToGist();
}

async function changeRank(i, val) {
  if (!isAdmin) return;
  users[i].rank = Number(val);
  await saveToGist();
}

function render() {
  if (!Array.isArray(users)) users = [];
  users.sort((a,b) => b.rank - a.rank);
  
  let html = `<tr><th>نام</th><th>Division</th><th>رنک</th>`;
  if (isAdmin) html += `<th>تغییر رنک</th><th>حذف</th>`;
  html += `</tr>`;
  
  if (users.length === 0) {
    html += `<tr><td colspan="${isAdmin?5:3}" style="padding:30px;color:#6b7280">📭 کاربری وجود ندارد</td></tr>`;
  }
  
  users.forEach((u,i) => {
    const divs = (u.divisions||[]).map(d => `<span class="tag ${d.toLowerCase()}">${d}</span>`).join('');
    html += `<tr>
      <td><strong>${u.name}</strong></td>
      <td>${divs||'—'}</td>
      <td class="rank${u.rank}">${u.rank}</td>`;
    if (isAdmin) {
      html += `<td><select onchange="changeRank(${i},this.value)">`;
      for (let r=10; r>=1; r--) {
        html += `<option value="${r}" ${u.rank===r?'selected':''}>${r}</option>`;
      }
      html += `</select></td>
      <td><button onclick="deleteUser(${i})" style="background:#ef4444">❌</button></td>`;
    }
    html += `</tr>`;
  });
  
  document.getElementById('table').innerHTML = html;
}

// جستجو
document.getElementById('search').addEventListener('keyup', function() {
  const filter = this.value.toLowerCase();
  const rows = document.querySelectorAll('#table tr');
  for (let i=1; i<rows.length; i++) {
    const name = rows[i].children[0]?.innerText?.toLowerCase() || '';
    rows[i].style.display = name.includes(filter) ? '' : 'none';
  }
});

// شروع
loadFromGist();
console.log('🔑 رمز: 1234');
</script>
</body>
</html>
