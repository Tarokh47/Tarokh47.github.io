<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست کاربران</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        table {
            margin: auto;
            width: 60%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0ea5e9;
        }

        tr:hover {
            background: #334155;
        }
    </style>
</head>

<body>

    <h1>لیست کاربران</h1>

    <table>
        <tr>
            <th>نام کاربر</th>
            <th>رنک</th>
        </tr>

        <tr>
            <td>Ali</td>
            <td>Owner</td>
        </tr>

        <tr>
            <td>Reza</td>
            <td>Admin</td>
        </tr>

        <tr>
            <td>Sara</td>
            <td>Member</td>
        </tr>

    </table>

</body>
</html>
