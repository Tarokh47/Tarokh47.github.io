<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>لیست کاربران</title>

<style>
body{
    font-family: Arial;
    background:#0b1220;
    color:white;
    text-align:center;
    padding:20px;
}

h1{color:#00d4ff;}

input,button,select{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    cursor:pointer;
    background:#00aaff;
    color:white;
}

table{
    margin:auto;
    width:80%;
    border-collapse:collapse;
    background:#111b2e;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    padding:12px;
    border-bottom:1px solid #223;
}

th{background:#00aaff;}

tr:hover{background:#1b2a44;}

/* رنک‌ها */
.rank10{color:#ff3b3b;font-weight:bold;}
.rank9{color:#ff7a00;font-weight:bold;}
.rank7{color:#ffd000;font-weight:bold;}
.rank4{color:#a6ff00;font-weight:bold;}
.rank3{color:#00ffa6;}
.rank2{color:#00c2ff;}
.rank1{color:#b0b0b0;}

#adminPanel{
    display:none;
    margin:20px;
}
</style>
</head>

<body>

<h1>لیست کاربران سرور Sanchez RP</h1>

<!-- لاگین ادمین -->
<div id="loginBox">
    <input type="password" id="pass" placeholder="رمز ادمین">
    <button onclick="login()">ورود ادمین</button>
</div>

<!-- پنل ادمین -->
<div id="adminPanel">

    <input type="text" id="name" placeholder="نام کاربر">

    <select id="rank">
        <option value="10">10</option>
        <option value="9">9</option>
        <option value="7">7</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
    </select>

    <button onclick="addUser()">افزودن</button>

</div>

<input type="text" id="search" placeholder="جستجو...">

<table id="table"></table>

<script>

const ADMIN_PASS = "1234"; // 🔐 رمزتو اینجا عوض کن

let isAdmin = false;

let users = JSON.parse(localStorage.getItem("users")) || [
    {name:"Parham Sanchez",rank:10},
    {name:"Arian Sanchez",rank:10},
    {name:"Mohsen Sanchez",rank:9},
    {name:"Tarokh Sanchez",rank:7},
    {name:"Barad Sanchez",rank:7},
    {name:"Mobin K",rank:7},
    {name:"Abtin Sanchez",rank:4},
    {name:"Amir Khodavandi",rank:3},
    {name:"Samyar Hossini",rank:3},
    {name:"Shariif Badri",rank:3},
    {name:"Mesa Mehran",rank:3},
    {name:"Nikan Sanchez",rank:3},
    {name:"Gabimro Holo",rank:2},
    {name:"Mahanzx Mahanzx",rank:2},
    {name:"Lio Matin",rank:1},
    {name:"Amoo Wolverine",rank:1},
    {name:"Hossein Mansory",rank:1},
    {name:"Arslan Odis",rank:1},
    {name:"Mahziyar Rastgoo",rank:1},
    {name:"Arashk Mozafari",rank:1},
    {name:"Radin Bongo",rank:1},
    {name:"Arman Org",rank:1},
    {name:"Erfan Rs",rank:1}
];

function save(){
    localStorage.setItem("users",JSON.stringify(users));
}

function login(){
    let p = document.getElementById("pass").value;
    if(p === ADMIN_PASS){
        isAdmin = true;
        document.getElementById("loginBox").style.display="none";
        document.getElementById("adminPanel").style.display="block";
        render();
    }else{
        alert("رمز اشتباهه!");
    }
}

function addUser(){
    let name = document.getElementById("name").value;
    let rank = document.getElementById("rank").value;

    if(name==="") return;

    users.push({name,rank:Number(rank)});
    save();
    render();
}

function del(i){
    if(isAdmin){
        users.splice(i,1);
        save();
        render();
    }
}

function render(){
    let table = document.getElementById("table");

    users.sort((a,b)=>b.rank-a.rank);

    let html = `
    <tr>
        <th>نام</th>
        <th>رنک</th>
        ${isAdmin ? "<th>حذف</th>" : ""}
    </tr>`;

    users.forEach((u,i)=>{
        html += `
        <tr>
            <td>${u.name}</td>
            <td class="rank${u.rank}">${u.rank}</td>
            ${isAdmin ? `<td><button onclick="del(${i})">❌</button></td>` : ""}
        </tr>`;
    });

    table.innerHTML = html;
}

document.getElementById("search").addEventListener("keyup",function(){
    let f = this.value.toLowerCase();
    let rows = document.querySelectorAll("tr");

    rows.forEach((r,i)=>{if(i==0) return;
        let name = r.children[0].innerText.toLowerCase();
        r.style.display = name.includes(f) ? "" : "none";
    });
});

render();

</script>

</body>
</html>
