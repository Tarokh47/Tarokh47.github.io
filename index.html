<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>RP Panel</title>

<style>
body{
body{
    font-family: Arial;
    background: radial-gradient(circle at top, #0b1220, #05070f);
    color:white;
    text-align:center;
    padding:20px;
}

/* عنوان نئونی */
h1{
    color:#00f5ff;
    text-shadow: 0 0 10px #00f5ff, 0 0 25px #00f5ff;
    margin-bottom:20px;
}

/* اینپوت‌ها */
input, select{
    padding:10px;
    margin:5px;
    border-radius:10px;
    border:1px solid #00f5ff33;
    background:#0f172a;
    color:white;
    outline:none;
    box-shadow: 0 0 10px #00f5ff22;
}

input:focus, select:focus{
    box-shadow: 0 0 15px #00f5ff88;
}

/* دکمه‌ها */
button{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background: linear-gradient(45deg, #00f5ff, #3b82f6);
    color:white;
    box-shadow: 0 0 12px #00f5ff66;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    box-shadow: 0 0 20px #00f5ffcc;
}

/* جدول */
table{
    margin:auto;
    width:85%;
    border-collapse:collapse;
    background:rgba(15, 23, 42, 0.8);
    border-radius:12px;
    overflow:hidden;
    box-shadow: 0 0 25px #00f5ff22;
    backdrop-filter: blur(8px);
}

th,td{
    padding:12px;
    border-bottom:1px solid #1f2a44;
}

th{
    background: linear-gradient(90deg, #00f5ff, #3b82f6);
    color:black;
    text-shadow:none;
}

tr:hover{
    background:#1b2a44;
    transition:0.2s;
}

/* نئونی کردن رنک‌ها */
.rank10{color:#ff2d2d;text-shadow:0 0 10px #ff2d2d;}
.rank9{color:#ff5e00;text-shadow:0 0 10px #ff5e00;}
.rank8{color:#ff9f1a;text-shadow:0 0 10px #ff9f1a;}
.rank7{color:#ffd000;text-shadow:0 0 10px #ffd000;}
.rank6{color:#b6ff00;text-shadow:0 0 10px #b6ff00;}
.rank5{color:#00ff6a;text-shadow:0 0 10px #00ff6a;}
.rank4{color:#00ffa6;text-shadow:0 0 10px #00ffa6;}
.rank3{color:#00d4ff;text-shadow:0 0 10px #00d4ff;}
.rank2{color:#3b82f6;text-shadow:0 0 10px #3b82f6;}
.rank1{color:#a1a1aa;text-shadow:0 0 10px #666;}
}

h1{color:#00d4ff;}

input,button,select{
    padding:8px;
    margin:4px;
    border-radius:6px;
    border:none;
}

button{
    cursor:pointer;
    background:#00aaff;
    color:white;
}

table{
    margin:auto;
    width:85%;
    border-collapse:collapse;
    background:#111b2e;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    padding:10px;
    border-bottom:1px solid #223;
}

th{background:#00aaff;}

tr:hover{background:#1b2a44;}

/* رنک */
.rank10{color:#ff2d2d; font-weight:bold;} /* قرمز خیلی قوی - بالاترین رنک */
.rank9{color:#ff5e00; font-weight:bold;}  /* نارنجی تند */
.rank8{color:#ff9f1a; font-weight:bold;}  /* نارنجی طلایی */
.rank7{color:#ffd000; font-weight:bold;}  /* زرد طلایی */
.rank6{color:#b6ff00; font-weight:bold;}  /* سبز-زرد */
.rank5{color:#00ff6a; font-weight:bold;}  /* سبز روشن */
.rank4{color:#00ffa6; font-weight:bold;}  /* سبز-فیروزه‌ای */
.rank3{color:#00d4ff; font-weight:bold;}  /* آبی روشن */
.rank2{color:#3b82f6; font-weight:bold;}  /* آبی متوسط */
.rank1{color:#a1a1aa; font-weight:bold;}  /* خاکستری - پایین‌ترین */

#panel{display:none;margin:15px;}
</style>
</head>

<body>

<h1>Sanchez Admin Panel</h1>

<!-- LOGIN -->
<div id="loginBox">
    <input type="password" id="pass" placeholder="رمز ادمین">
    <button onclick="login()">ورود</button>
</div>

<!-- ADMIN PANEL -->
<div id="panel">

    <input type="text" id="name" placeholder="نام کاربر">

    <select id="rank">
        <option value="10">10</option>
        <option value="9">9</option>
        <option value="8">8</option>
        <option value="7">7</option>
        <option value="6">6</option>
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
    </select>

    <button onclick="addUser()">➕ افزودن</button>
</div>

<input type="text" id="search" placeholder="جستجو...">

<table id="table"></table>

<script>

const PASS = "1234"; // 🔐 رمز
let isAdmin = false;

let users = JSON.parse(localStorage.getItem("users")) || [];

function save(){
    localStorage.setItem("users",JSON.stringify(users));
}

function login(){
    if(document.getElementById("pass").value === PASS){
        isAdmin = true;
        document.getElementById("loginBox").style.display="none";
        document.getElementById("panel").style.display="block";
        render();
    }else{
        alert("رمز اشتباهه");
    }
}

function addUser(){
    let name = document.getElementById("name").value;
    let rank = Number(document.getElementById("rank").value);

    if(name==="") return;

    users.push({name,rank});
    save();
    render();
}

function deleteUser(i){
    if(isAdmin){
        users.splice(i,1);
        save();
        render();
    }
}

function changeRank(i,newRank){
    users[i].rank = Number(newRank);
    save();
    render();
}

function render(){

    users.sort((a,b)=>b.rank-a.rank);

    let html = `
    <tr>
        <th>نام</th>
        <th>رنک</th>
        ${isAdmin ? "<th>ویرایش رنک</th><th>حذف</th>" : ""}
    </tr>`;

    users.forEach((u,i)=>{
        html += `
        <tr>
            <td>${u.name}</td>
            <td class="rank${u.rank}">${u.rank}</td>

            ${isAdmin ? `
            <td>
                <select onchange="changeRank(${i},this.value)">
                    <option ${u.rank==10?"selected":""} value="10">10</option>
                    <option ${u.rank==9?"selected":""} value="9">9</option>
                    <option ${u.rank==8?"selected":""} value="7">7</option>
                    <option ${u.rank==7?"selected":""} value="4">4</option>
                    <option ${u.rank==6?"selected":""} value="3">3</option>
                    <option ${u.rank==5?"selected":""} value="2">2</option>
                    <option ${u.rank==4?"selected":""} value="1">1</option>
                    <option ${u.rank==3?"selected":""} value="1">1</option>
                    <option ${u.rank==2?"selected":""} value="1">1</option>
                    <option ${u.rank==1?"selected":""} value="1">1</option>
                </select>
            </td>

            <td><button onclick="deleteUser(${i})">❌</button></td>
            ` : ""}
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
}

document.getElementById("search").addEventListener("keyup",function(){
    let f = this.value.toLowerCase();
    let rows = document.querySelectorAll("tr");

    rows.forEach((r,i)=>{
        if(i==0) return;
        let name = r.children[0]?.innerText.toLowerCase();
        r.style.display = name?.includes(f) ? "" : "none";
    });
});

render();

</script>

</body>
</html>
